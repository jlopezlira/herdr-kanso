name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the version check compares against the last release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versioning (version.json, CHANGELOG.md, semantic bumps)
        run: npm run check:version
      - name: sqlite3 (Shipped's store tests run the real one)
        run: command -v sqlite3 || (sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3)
      - name: Tests
        run: npm test
