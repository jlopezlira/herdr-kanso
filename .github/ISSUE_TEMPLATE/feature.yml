name: Feature
description: Something kansō could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. Not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you would like to happen, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it works
      description: What you would see or do when it is done.
    validations:
      required: true
