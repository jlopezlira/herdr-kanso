name: Bug
description: Something does not work the way kansō says it does.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: One or two sentences. What you saw, not what you think the cause is.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a fresh window. Say if it happens every time.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kansō version
      description: Settings, then What's new shows it.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Computer
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot or the last lines of an error. Remove anything private first.
