name: CI

# A push to develop publishes vX.Y.Z-beta.N once all three platforms pass, when
# what kanso installs changed since the last beta of that version or the newest stable tag.
# A push to main publishes vX.Y.Z the same way: only after all three platforms pass.
on:
  pull_request:
  push:
    branches: [main, develop]

# A new push to a pull request replaces its older run; runs on main and develop always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the version check compares against the last release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versioning (version.json, CHANGELOG.md, semantic bumps)
        env:
          KANSO_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: npm run check:version
      - name: Shared files
        run: npm run sync:share -- --check
      - name: sqlite3 on Linux
        if: runner.os == 'Linux'
        run: command -v sqlite3 || (sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3)
      - name: sqlite3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            choco install sqlite --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # The tests start sqlite3 hundreds of times: the real one, not Chocolatey's shim in front of it.
            Add-Content $env:GITHUB_PATH "$env:ChocolateyInstall\lib\SQLite\tools"
          }
      - name: Tests
        timeout-minutes: 20
        run: npm test
  test:
    needs: platform
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All platforms passed
        env:
          RESULT: ${{ needs.platform.result }}
        run: test "$RESULT" = success
  beta:
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: beta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: npm run check:version
      - name: Plan the beta
        id: plan
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-plan.mjs beta
      - name: Publish the beta
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.plan.outputs.title }}" --notes-file "${{ steps.plan.outputs.notes }}" --prerelease
  stable:
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: npm run check:version
      - name: Plan the stable release
        id: plan
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-plan.mjs stable
      - name: Publish the stable release
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.plan.outputs.title }}" --notes-file "${{ steps.plan.outputs.notes }}"
