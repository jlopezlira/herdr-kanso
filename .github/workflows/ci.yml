name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the version check compares against the last release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versioning (version.json, CHANGELOG.md, semantic bumps)
        env:
          KANSO_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: npm run check:version
      - name: Shared files
        run: npm run sync:share -- --check
      - name: sqlite3 on Linux
        if: runner.os == 'Linux'
        run: command -v sqlite3 || (sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3)
      - name: sqlite3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            choco install sqlite --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Tests
        timeout-minutes: 20
        run: npm test
  test:
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All platforms passed
        env:
          RESULT: ${{ needs.platform.result }}
        run: test "$RESULT" = success
