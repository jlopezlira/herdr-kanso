name: Pages

# Publishes site/ (the landing page and its pages) to GitHub Pages, with
# CHANGELOG.md beside them for the changelog page.
on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy only from main
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "the site deploys only from main (this is $GITHUB_REF_NAME)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # The changelog page reads it next to itself, so a release shows there.
      - run: cp CHANGELOG.md site/CHANGELOG.md
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
