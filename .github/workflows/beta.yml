name: Beta

# A push to develop publishes vX.Y.Z-beta.N when what kanso installs changed
# since the last beta of that version, or since the newest stable tag.
on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: npm run check:version
      - name: Plan the beta
        id: plan
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-plan.mjs beta
      - name: Publish the beta
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.plan.outputs.title }}" --notes-file "${{ steps.plan.outputs.notes }}" --prerelease
