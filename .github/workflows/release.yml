name: Release

# Merging develop into main releases the version in version.json when that
# tag does not exist yet. Nothing else creates a plain vX.Y.Z tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: npm run check:version
      - name: Plan the stable release
        id: plan
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-plan.mjs stable
      - name: Publish the stable release
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.plan.outputs.title }}" --notes-file "${{ steps.plan.outputs.notes }}"
