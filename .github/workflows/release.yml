name: Release

# Merging to main releases the version in kanso/mods/kanso-chrome/version.json
# when it has no tag yet. The tag is what Kanso's updater offers, so a merged
# change reaches people without anyone tagging it by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        run: npm run check:version
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./kanso/mods/kanso-chrome/version.json").version')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            exit 0
          fi
          node scripts/check-version.mjs --notes > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "Kanso $version" --notes-file "$RUNNER_TEMP/notes.md"
