name: Feature request
description: Something you are trying to do with kansō.
body:
  - type: textarea
    id: trying
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: How we know it works
      description: Observable outcomes, one per line.
    validations:
      required: true
