name: Release

# One release planned from CHANGELOG.md and published on GitHub: a beta, a release candidate or a stable release.
on:
  workflow_call:
    inputs:
      kind:
        description: The release-plan arguments, as beta, stable or rc --prepare.
        type: string
        required: true
      branch:
        description: The only branch it runs from.
        type: string
        required: true
      ref:
        description: What to check out, when not the commit that started it.
        type: string
        default: ""
      group:
        description: "The concurrency group, so that one release of this kind runs at a time."
        type: string
        required: true
      tag:
        description: "archive: tag a detached commit with the computed version. commit: commit CHANGELOG.md and version.json to the branch and tag it. Empty: gh tags the target."
        type: string
        default: ""
      options:
        description: More gh release create options.
        type: string
        default: ""
    secrets:
      KANSO_RELEASE_KEY:
        description: The ssh key that signs each release's archive, checked by kanso-tabs/allowed_signers.
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.group }}
      cancel-in-progress: false
    env:
      KANSO_BRANCH: ${{ github.ref_name }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_KIND: ${{ inputs.kind }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_OPTIONS: ${{ inputs.options }}
    steps:
      - name: Require the branch
        run: test "$GITHUB_REF_NAME" = "$INPUT_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # tags: the plan compares against the last release
      - uses: ./.github/actions/node
      - name: Check the versioning
        run: npm run check:version
      - name: Plan
        id: plan
        run: |
          if [ "$INPUT_TAG" = archive ] && [ "$(git ls-remote origin "refs/heads/$INPUT_BRANCH" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "a newer commit on $INPUT_BRANCH publishes instead of $GITHUB_SHA"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-plan.mjs $INPUT_KIND
      - name: Tag as the actor
        if: steps.plan.outputs.action == 'release' && inputs.tag != ''
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          echo "RELEASE_TAG=$PLAN_TAG" >> "$GITHUB_ENV"
        env:
          PLAN_TAG: ${{ steps.plan.outputs.tag }}
      - name: Tag the archive
        if: steps.plan.outputs.action == 'release' && inputs.tag == 'archive'
        run: node scripts/release-tag.mjs "$RELEASE_TAG"
      - name: Commit and tag
        if: steps.plan.outputs.action == 'release' && inputs.tag == 'commit'
        run: |
          git add CHANGELOG.md kanso/mods/kanso-chrome/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare $RELEASE_TAG"
          fi
          node scripts/release-tag.mjs "$RELEASE_TAG"
      - name: Sign the archive
        if: steps.plan.outputs.action == 'release'
        env:
          PLAN_TAG: ${{ steps.plan.outputs.tag }}
          SIGNING_KEY: ${{ secrets.KANSO_RELEASE_KEY }}
        run: node scripts/release-sign.mjs "$PLAN_TAG" "$RUNNER_TEMP"
      - name: Push the tag
        if: steps.plan.outputs.action == 'release' && inputs.tag == 'archive'
        run: git push origin "refs/tags/$RELEASE_TAG"
      - name: Push the commit and tag
        if: steps.plan.outputs.action == 'release' && inputs.tag == 'commit'
        run: git push --atomic origin "HEAD:refs/heads/$INPUT_BRANCH" "refs/tags/$RELEASE_TAG"
      - name: Publish
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_TAG: ${{ steps.plan.outputs.tag }}
          PLAN_TITLE: ${{ steps.plan.outputs.title }}
          PLAN_NOTES: ${{ steps.plan.outputs.notes }}
          TARGET: ${{ inputs.tag == '' && github.sha || '' }}
        run: gh release create "$PLAN_TAG" $INPUT_OPTIONS ${TARGET:+--target "$TARGET"} --title "$PLAN_TITLE" --notes-file "$PLAN_NOTES" "$RUNNER_TEMP/kanso-$PLAN_TAG.tar.gz" "$RUNNER_TEMP/kanso-$PLAN_TAG.tar.gz.sig"
