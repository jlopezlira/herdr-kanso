name: Pages

# Publishes site/ (the landing page and its pages) to GitHub Pages, with
# CHANGELOG.md beside them for the changelog page.
on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/pages.yml", ".storybook/**", "stories/**", "kanso/tokens.json", "package.json", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only from main
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "the site deploys only from main (this is $GITHUB_REF_NAME)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The changelog page reads it next to itself, so a release shows there.
      - run: cp CHANGELOG.md site/CHANGELOG.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook -- -o site/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
