name: Pages

# Publishes site/ (the landing page and its pages) to GitHub Pages, with
# CHANGELOG.md beside them for the changelog page.
on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy only from main
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "the site deploys only from main (this is $GITHUB_REF_NAME)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # The changelog page reads it next to itself, so a release shows there.
      - run: cp CHANGELOG.md site/CHANGELOG.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
