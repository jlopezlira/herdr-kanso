name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-release
  cancel-in-progress: false

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require develop
        run: test "$GITHUB_REF_NAME" = develop
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the versioning
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: npm run check:version
      - name: Plan the release candidate
        id: plan
        env:
          KANSO_BRANCH: ${{ github.ref_name }}
        run: node scripts/release-plan.mjs rc --prepare
      - name: Commit and tag the release candidate
        if: steps.plan.outputs.action == 'release'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add CHANGELOG.md kanso/mods/kanso-chrome/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare $RELEASE_TAG"
          fi
          node scripts/release-tag.mjs "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/develop "refs/tags/$RELEASE_TAG"
      - name: Publish the release candidate
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.plan.outputs.tag }}" --verify-tag --title "${{ steps.plan.outputs.title }}" --notes-file "${{ steps.plan.outputs.notes }}" --prerelease
