name: Node
description: The Node version the checks and scripts run on.
inputs:
  cache:
    description: The package manager whose downloads are kept between runs, or none.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        cache: ${{ inputs.cache }}
        node-version: 22
